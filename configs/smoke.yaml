# Fast config for tests and quick iteration: 10 tickers, ~2 years, <1 min.
name: smoke
seed: 0

universe:
  tickers: [AAPL, MSFT, AMZN, GOOGL, JPM, XOM, JNJ, PG, KO, WMT]

data:
  start: "2024-09-01"
  end: null            # null = today
  cache_dir: data/cache
  min_history_days: 300

labels:
  k: 0.5
  vol_window: 20

split:
  train_years: 1
  sanity_days: 10

models:
  - logreg
  - hgb
# majority_class and always_up are always added automatically as baselines.

per_ticker: false
rolling_window: 20

leak_alarm:
  threshold: 0.60
  min_days: 250

runs_dir: runs
