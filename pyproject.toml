[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockml"
version = "0.1.0"
description = "Honest next-day direction framework for US large-cap stocks (step 1)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pandas>=2.2,<3",
  "numpy<3",
  "scikit-learn>=1.4",
  "pyarrow>=14",
  "yfinance>=0.2.40",
  "pyyaml>=6",
  "scipy>=1.11",
  "typer>=0.12",
  "matplotlib>=3.8",
  "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stockml = "stockml.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stockml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
